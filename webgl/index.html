<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>WebGL 2023 - 01 Hello, Triangle!</title>
    <link rel="stylesheet" href="resources/css/ui-lightness/jquery-ui-1.8.16.custom.css">

    <style>
      html, head, body {
        margin: 0;
        padding: 25px;
        background-color: #2a2a2a;
      }

      .main-container {
        display: flex;
        gap: 30px;
        align-items: flex-start;
      }

      .canvas-wrapper {
        position: relative;
        display: inline-block;
      }

      #demo-canvas {
        width: 800px;
        height: 800px;

        /*
         * WebGL trick: pick an offensive canvas background color to test
         *  opacity/clearing bugs
         */
        background-color: #373535;

        /* Help to illustrate the rasterizer's job: when artificially lowering resolution, show pixelated image */
        image-rendering: crisp-edges;
      }

      .origin-dot {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: red;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /** CSS to make a nice little error box output for debugging (nice if you can't use devtools, e.g. mobile)  */
      #error-box {
        color: #fd8080;
        font-weight: 500;
        font-size: 18pt;
        border: 1px solid white;
        padding: 25px;
        margin-top: 20px;
      }

      .error-box-title {
        color: #eee;
        border-bottom: 1px solid gray;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
        color: #eee;
        font-family: monospace;
        min-width: 300px;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="canvas-wrapper">
        <canvas id="demo-canvas" width="800px" height="800px">
        <!-- This message shows up only if the Canvas element isn't supported -->
        HTML5 canvas not supported in your browser! These demos will not work.
      </canvas>
        <div class="origin-dot" aria-hidden="true"></div>
      </div>
      <div class="controls">
        <div id="scaleX"></div>
        <div id="scaleY"></div>
        <div id="x"></div>
        <div id="y"></div>
        <div id="rotation"></div>
      </div>
    </div>

    <!--
      Doing a little error output in the HTML is nice when testing on mobile,
       tttt you don't have access to console.log.
    -->
    <script src="resources/jquery-1.7.1.min.js"></script>
    <script src="resources/jquery-ui-1.8.16.custom.min.js"></script>
    <script src="resources/jquery.mousecapture.js"></script>
    <script src="resources/jquery.gman.ui.js"></script>
    <script src="resources/jquery-gman-circle.js"></script>
    <script src="resources/webgl-lessons-ui.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
